56DDn7R1wpx-186\&quot; parent=\&quot;1\&quot; style=\&quot;shape=hexagon;perimeter=hexagonPerimeter2;whiteSpace=wrap;html=1;shapeInside=1;fixedSize=1;\&quot; value=\&quot;调用带网络搜索功能的API LLM\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;80\&quot; width=\&quot;120\&quot; x=\&quot;1330\&quot; y=\&quot;1380\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;2uQtx1R6O56DDn7R1wpx-190\&quot; parent=\&quot;1\&quot; style=\&quot;shape=card;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;M4：模型&amp;quot;没吭声&amp;quot;怎么办（空响应重试）&amp;lt;div&amp;gt;管什么：偶尔会出现这种情况——我们问了模型，它却什么都没答，一个字都没吐出来就结束了。&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;怎么处理：再问一次，一模一样地重问。还是没答，就放弃，对用户说一句&amp;quot;抱歉，我刚走神了&amp;quot;。&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;要点：- 三个模型（1.7b、9b、API）不管哪个没吭声，都用这一招。- 只重试一次，不会没完没了地问。&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;235\&quot; width=\&quot;195\&quot; x=\&quot;20\&quot; y=\&quot;10\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;2uQtx1R6O56DDn7R1wpx-191\&quot; parent=\&quot;1\&quot; style=\&quot;shape=card;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent;&amp;quot;&amp;gt;M5：还没开始播TTS或业务确认信息还没开始播用户又插话（未实现）&amp;lt;/span&amp;gt;&amp;lt;div&amp;gt;管什么：用户说&amp;quot;设个明天8点的闹钟&amp;quot;，系统还在处理、回复还没说出口，用户又说&amp;quot;算了别记了&amp;quot;。这句&amp;quot;算了&amp;quot;该怎么办？&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;235\&quot; width=\&quot;105\&quot; x=\&quot;235\&quot; y=\&quot;10\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;2uQtx1R6O56DDn7R1wpx-194\&quot; parent=\&quot;1\&quot; style=\&quot;shape=card;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;text-align: left;&amp;quot;&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;M6：半夜干杂活（夜间任务，未实现）&amp;lt;/span&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;text-align: left;&amp;quot;&amp;gt;管什么：有些活不用当着用户面干，适合半夜偷偷做。比如：把用户删掉的记忆真正从库里清走（删除时只是先打个&amp;quot;已删&amp;quot;标记，留一段反悔期）、给提醒日程表补货（见 M9）。&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;text-align: left;&amp;quot;&amp;gt;怎么运作：每个整点看一眼所有用户，谁正处在自己的免打扰时段、而且这个时段里还没干过活，就给他跑一次夜间任务。保证每人每晚只干一次。&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;235\&quot; width=\&quot;206\&quot; x=\&quot;360\&quot; y=\&quot;10\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;2uQtx1R6O56DDn7R1wpx-195\&quot; parent=\&quot;1\&quot; style=\&quot;shape=card;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;M7：哒哒的&amp;quot;短期记性&amp;quot;（对话上下文管理）&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;管什么：让哒哒记得刚才聊了什么。用户说&amp;quot;把它改到九点&amp;quot;，哒哒得知道&amp;quot;它&amp;quot;指的是上一句提到的那个提醒——靠的就是这份短期记忆。&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;每次调用模型（不管 1.7b、9b 还是 API），都把这份小抄带上，让模型知道前情。&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;什么时候清空：&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;用户 2 分钟没说话——哒哒判断这场对话结束了，把小抄扔掉（网络连接不断，只是清脑子）。&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;235\&quot; width=\&quot;206\&quot; x=\&quot;586\&quot; y=\&quot;10\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;2uQtx1R6O56DDn7R1wpx-196\&quot; parent=\&quot;1\&quot; style=\&quot;shape=card;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;M8：闹钟到点是怎么响的（提醒触发扫描器，已实装）&amp;lt;br&amp;gt;管什么：用户设的提醒，到点要真的响出来。&amp;lt;div&amp;gt;怎么运作：&amp;lt;br&amp;gt;1.每分钟巡逻一次：翻一遍日程表，把&amp;quot;接下来一分半钟内要响&amp;quot;的条目都捞出来。&amp;amp;nbsp;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;2.给每条上一个倒计时：比如 40 秒后到点，就掐着 40 秒等，到点精确触发。这样&amp;quot;1分30秒后提醒我关火&amp;quot;这种掐秒的提醒也不会有误差。响之前再看一眼库里的最新状态——如果用户在这几十秒里刚好把它取消了，就不响。&amp;amp;nbsp;&amp;lt;/div&amp;gt;\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;235\&quot; width=\&quot;195\&quot; x=\&quot;20\&quot; y=\&quot;270\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;2uQtx1R6O56DDn7R1wpx-197\&quot; parent=\&quot;1\&quot; style=\&quot;shape=card;whiteSpace=wrap;html=1;\&quot; value=\&quot;&amp;lt;span style=&amp;quot;white-space: pre;&amp;quot;&amp;gt;&amp;#x9;&amp;lt;/span&amp;gt;M9：把&amp;quot;提醒规则&amp;quot;翻译成&amp;quot;具体日程&amp;quot;（物化函数，已实装）&amp;lt;br&amp;gt;管什么：用户说&amp;quot;每个工作日早上8点提醒我吃药&amp;quot;，这是一条**规则**；但闹钟要响，得先算出**具体哪几天的8点**。把规则展开成未来 7 天一条条具体日程，就是&amp;quot;物化&amp;quot;。&amp;lt;br&amp;gt;怎么运作：每条提醒按复杂程度走三条路——&amp;lt;br&amp;gt;简单的（每天、每周、工作日这类）：纯代码用日历算，不花一分钱模型调用。工作日/节假日靠节假日表判断，月底、闰年这些坑都处理了。&amp;lt;br&amp;gt;新建的提醒：先让代码算一遍，再请 API 大模型当一次考官检查算得对不对。考核通过，这条提醒从此走纯代码；考不过，说明它比看上去复杂，从此每次都请大模型来算。&amp;lt;br&amp;gt;复杂的（&amp;quot;每逢周五且是月末&amp;quot;这类）：直接请 API 大模型算。算完代码还要把关一遍——日期格式不对的、过期的、超出 7 天窗口的，一律扔掉，绝不带病入库。&amp;lt;br&amp;gt;为什么用 API 大模型而不是自家 9b**：实测 9b 算日历会出&amp;quot;7月32日&amp;quot;这种错；这是后台活，慢一点没关系，算对最要紧。&amp;lt;br&amp;gt;什么时候干活：新建提醒时、修改提醒时（推倒重算）、每晚夜间任务时（往后滚动补足 7 天，让日程表永远有货）。\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry height=\&quot;235\&quot; width=\&quot;440\&quot; x=\&quot;235\&quot; y=\&quot;270\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n      &lt;/root&gt;\n    &lt;/mxGraphModel&gt;\n  &lt;/diagram&gt;\n&lt;/mxfile&gt;\n&quot;}"></div>
